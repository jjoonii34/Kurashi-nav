name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: vet
        run: go vet ./...

      - name: test (race + coverage)
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image (not pushed; publishing comes with the infra phase)
        run: docker build --build-arg VERSION=${{ github.sha }} -t kurashi-nav:ci .
      - name: smoke test
        run: |
          docker run -d --name api -p 8080:8080 kurashi-nav:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/healthz && exit 0; sleep 1; done
          docker logs api; exit 1
