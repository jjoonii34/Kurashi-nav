name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: vet
        run: go vet ./...

      - name: test (race + coverage)
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: API types match docs/openapi.json
        run: npm run gen:api && git diff --exit-code -- api/schema.d.ts

      - name: lint
        run: npm run lint

      - name: test
        run: npm test

      - name: build (static export)
        run: npm run build

      - name: export produced the pages Cloudflare serves
        run: test -f out/index.html && test -f out/404.html

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image (not pushed; publishing comes with the infra phase)
        run: docker build --build-arg VERSION=${{ github.sha }} -t kuramiru:ci .
      - name: smoke test
        run: |
          docker run -d --name api -p 8080:8080 kuramiru:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/healthz && exit 0; sleep 1; done
          docker logs api; exit 1
